{% extends 'Master/base.html' %}
{% block title %}Reset Password{% endblock title %}
{% block content %}
<div class="form mt-5">
    <!--login form start-->
    <div class="card-header justify-content-center live-theme">
        <h3 class="font-weight-light my-2 text-center">Reset Password</h3>
    </div>
    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="form-floating mb-3">
                <input type="email" name="email" autocomplete="new-password" required id="id_email" class="form-control"
                    placeholder="Email">
                <label for="id_email">Enter your Email</label>
            </div>
            <button type="submit" class="col-md-2 btn btn-block live-theme" id="reset">Submit</button>
            <p class="mt-3">Wanna go back?<a class="text-decoration-none" href="{% url 'login' %}"> Click Here </a></p>
        </form>
    </div>
    </form>
</div>
{% endblock content %}
