{% extends 'Master/base.html' %}

{% block title %} Reset Password {% endblock title %}
{% block content %}
<div class="form mt-5">
    <div class="card-header justify-content-center live-theme">
        <h3 class="font-weight-light my-2 text-center">Reset Password</h3>
    </div>
    <div class="card-body">
        <form action="" method="POST" enctype="multipart/form-data" id="reset">
            {% csrf_token %}
            <div class="form-floating mb-3">
                <input type="password" name="new_password1" required id="id_new_password1" class="form-control"
                    placeholder="Enter New Password">
                <label for="id_new_password1">Enter New Password</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" name="new_password2" required id="id_new_password2" class="form-control"
                    placeholder="Confirm New Password">
                <label for="id_new_password2">Confirm New Password</label>
            </div>
            <button type="submit" class="col-md-4 btn live-theme" id="reset">Change Password</button>
        </form>
    </div>
</div>
{% endblock content %}
