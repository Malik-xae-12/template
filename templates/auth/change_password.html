{% extends 'Master/base.html' %}
{% load static %}
{% block title %}Change Password{% endblock %}
{% block content %}
<nav class="custom-bread mt-2" aria-label="breadcrumb">
    <ol class="breadcrumb" style="float: right;">
        <li class="breadcrumb-item" aria-current="page"><a href="{% url 'home' %}" class="text-decoration-none"><i
                    class="fa fa-home"></i>&nbsp;Home</a></li>
        <li class="breadcrumb-item"><a href="{% url 'admin:auth_user_changelist' %}"
                class="text-decoration-none">User</a></li>
        <li class="breadcrumb-item text-primary">{{user}}</li>
        <li class="breadcrumb-item" aria-current="page">Change Password</li>
    </ol>
</nav>
<div class="float-left mt-2">
    <h1 class="m-0" style="visibility: hidden;">Profile</h1>
    <div class="form mt-5">
        <div class="card-header justify-content-center live-theme">
            <h3 class="font-weight-light my-2 text-center">Change Your Password</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="form-floating mb-3">
                    <input type="password" name="old_password" autocomplete="new-password" required id="id_old_password"
                        class="form-control" id="floatingPassword" placeholder="Enter Old Password">
                    <label for="id_old_password">Old Password</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" name="new_password1" autocomplete="new-password" required
                        id="id_new_password1" class="form-control" id="floatingPassword"
                        placeholder="Enter New Password">
                    <label for="id_new_password1">New Password</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" name="new_password2" autocomplete="new-password" required
                        id="id_new_password2" class="form-control" id="floatingPassword"
                        placeholder="Enter New Password">
                    <label for="id_new_password2">Confirm New Password</label>
                </div>
                <button type="submit" class="col-md-4 btn btn-block live-theme" id="reset">Update
                    Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
